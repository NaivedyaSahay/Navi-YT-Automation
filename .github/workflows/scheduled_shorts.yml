name: Automated YouTube Shorts

on:
  schedule:
    # Times in UTC (IST is UTC + 5:30)
    # 8:00 AM IST = 2:30 AM UTC
    - cron: '30 2 * * *'
    # 2:00 PM IST = 8:30 AM UTC
    - cron: '30 8 * * *'
    # 8:00 PM IST = 2:30 PM UTC
    - cron: '30 14 * * *'

  # Allows manual triggering anytime from the Actions tab in GitHub UI
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies (FFmpeg & Devanagari Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu-core fonts-noto-core fonts-deva

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── Restore posted_topics.json from cache (prevents topic repetition) ──
      - name: Restore posted topics cache
        uses: actions/cache@v4
        with:
          path: posted_topics.json
          # Single rolling key — always saves the latest version
          key: posted-topics-${{ github.run_id }}
          restore-keys: |
            posted-topics-

      - name: Restore configuration and OAuth secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          CLIENT_SECRETS_JSON: ${{ secrets.CLIENT_SECRETS_JSON }}
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
        run: |
          # ── Write .env ──
          cat > .env <<EOT
          # AI Script Generation
          GROQ_API_KEY=$GROQ_API_KEY
          GEMINI_API_KEY=$GEMINI_API_KEY
          GROQ_MODEL=groq/compound
          GEMINI_MODEL=gemini-3.6-flash

          # Hugging Face FLUX AI Image Generation
          HF_TOKEN=$HF_TOKEN
          HF_IMAGE_MODEL=black-forest-labs/FLUX.1-schnell

          # Stock Footage APIs
          PEXELS_API_KEY=$PEXELS_API_KEY
          PIXABAY_API_KEY=$PIXABAY_API_KEY

          # TTS Voice Settings (Hindi)
          TTS_PROVIDER=edge-tts
          SARVAM_API_KEY=$SARVAM_API_KEY
          SARVAM_SPEAKER=ratan
          SARVAM_MODEL=bulbul:v3
          TTS_VOICE=hi-IN-SwaraNeural
          TTS_RATE=+0%
          TTS_PITCH=+0Hz
          TTS_VOLUME=+0%

          # Music & Video Settings
          BGM_VOLUME=0.035
          VIDEO_WIDTH=1080
          VIDEO_HEIGHT=1920
          VIDEO_FPS=30
          VIDEO_CODEC=libx264
          AUDIO_CODEC=aac
          VIDEO_BITRATE=8M
          OUTPUT_DIR=output

          # YouTube Upload Defaults
          CLIENT_SECRETS_FILE=client_secrets.json
          TOKEN_FILE=token.json
          DEFAULT_PRIVACY_STATUS=public
          DEFAULT_CATEGORY_ID=22
          EOT

          # ── Write JSON secrets safely (printf avoids trailing newline) ──
          if [ -n "$CLIENT_SECRETS_JSON" ]; then
            printf '%s' "$CLIENT_SECRETS_JSON" > client_secrets.json
            echo "✅ client_secrets.json restored"
          else
            echo "⚠️ CLIENT_SECRETS_JSON secret is empty!"
          fi

          if [ -n "$TOKEN_JSON" ]; then
            printf '%s' "$TOKEN_JSON" > token.json
            # Save a snapshot to detect if the token was refreshed later
            cp token.json token_before.json
            echo "✅ token.json restored"
          else
            echo "❌ TOKEN_JSON secret is empty — upload will fail!"
            exit 1
          fi

      - name: Run Shorts Automation Pipeline
        run: |
          python main.py --auto --privacy public

      # ── Persist refreshed token back to GitHub Secrets ──────────────────
      # If the OAuth library refreshed the token during the run, the local
      # token.json now contains a NEW access_token (and possibly a rotated
      # refresh_token). We must push it back so the next run doesn't fail.
      - name: Update TOKEN_JSON secret if token was refreshed
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ ! -f token.json ]; then
            echo "⚠️ token.json not found — nothing to persist"
            exit 0
          fi

          # Only update if the token actually changed
          if [ -f token_before.json ] && diff -q token.json token_before.json > /dev/null 2>&1; then
            echo "ℹ️ token.json unchanged — no secret update needed"
            exit 0
          fi

          echo "🔄 token.json was refreshed — updating GitHub secret..."

          # Use GitHub CLI to update the repository secret
          if [ -n "$GH_TOKEN" ]; then
            gh secret set TOKEN_JSON < token.json
            echo "✅ TOKEN_JSON secret updated successfully"
          else
            echo "⚠️ GH_PAT secret not configured — cannot auto-update TOKEN_JSON"
            echo "⚠️ You may need to manually update the TOKEN_JSON secret"
            echo "--- Current token.json content (for manual update) ---"
            echo "::warning::Token was refreshed but could not be persisted. Set GH_PAT secret to enable auto-persistence."
          fi

      # ── Upload token.json as artifact on failure (safety net) ───────────
      - name: Save token.json as artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-token-json
          path: token.json
          retention-days: 7
