name: Automated YouTube Shorts

on:
  schedule:
    # Times in UTC (IST is UTC + 5:30)
    # 8:00 AM IST = 2:30 AM UTC
    - cron: '30 2 * * *'
    # 2:00 PM IST = 8:30 AM UTC
    - cron: '30 8 * * *'
    # 8:00 PM IST = 2:30 PM UTC
    - cron: '30 14 * * *'

  # Allows manual triggering anytime from the Actions tab in GitHub UI
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore configuration and OAuth secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          CLIENT_SECRETS_JSON: ${{ secrets.CLIENT_SECRETS_JSON }}
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
        run: |
          cat <<EOT > .env
          GEMINI_API_KEY=$GEMINI_API_KEY
          GROQ_API_KEY=$GROQ_API_KEY
          PEXELS_API_KEY=$PEXELS_API_KEY
          PIXABAY_API_KEY=$PIXABAY_API_KEY
          GEMINI_MODEL=gemini-2.0-flash
          TTS_VOICE=en-US-ChristopherNeural
          OUTPUT_DIR=output
          CLIENT_SECRETS_FILE=client_secrets.json
          TOKEN_FILE=token.json
          DEFAULT_PRIVACY_STATUS=public
          DEFAULT_CATEGORY_ID=22
          EOT

          if [ -n "$CLIENT_SECRETS_JSON" ]; then
            echo "$CLIENT_SECRETS_JSON" > client_secrets.json
          fi

          if [ -n "$TOKEN_JSON" ]; then
            echo "$TOKEN_JSON" > token.json
          fi

      - name: Run Shorts Automation Pipeline
        run: |
          python main.py --auto --privacy public
